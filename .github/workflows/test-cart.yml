name: SmartEase cart checks
on:
  push:
    branches: [smartease-cart-lights]
  pull_request:
    branches: [smartease-cart-lights]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
